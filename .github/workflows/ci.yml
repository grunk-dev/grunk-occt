# 3-platform CI matrix (see DESIGN.md's "Scope" section): every step of the migration
# plan targets Linux, macOS, and Windows, with AD-enabled builds as the sole,
# deliberately deferred exception. This is what makes future grunk-pin bumps and
# generator changes safe on all three platforms, not just Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Windows runners have a MinGW toolchain on PATH by default, which CMake picks
      # up ahead of MSVC's cl.exe (not on PATH without this) - build against MSVC
      # instead, matching grunk's own CI (.github/workflows/build-test.yml) and
      # avoiding MinGW-vs-sol2/grunk header conflicts (e.g. NOMINMAX redefinition
      # warnings from grunk/plugin/loader.cpp under MinGW's own os_defines.h).
      - name: Set up Visual Studio shell
        if: startsWith(matrix.os, 'windows')
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Configure
        run: pixi run -e default configure Release

      - name: Build
        run: pixi run -e default build

      - name: Test
        run: pixi run -e default test

      - name: Run examples
        run: pixi run -e default run_examples

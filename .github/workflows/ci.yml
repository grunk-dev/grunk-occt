# 3-platform CI matrix (see DESIGN.md's "Scope" section): every step of the migration
# plan targets Linux, macOS, and Windows. AD-enabled builds (see build-and-test-ad
# below) are the one platform exception that's real, not just deferred - Linux-only,
# matching pixi.toml's own `ad` feature (`platforms = ["linux-64"]`), since building
# ADOL-C/adOCCT from source on macOS/Windows was never attempted (see README.md's
# "Building with AD support").
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Windows runners have a MinGW toolchain on PATH by default, which CMake picks
      # up ahead of MSVC's cl.exe (not on PATH without this) - build against MSVC
      # instead, matching grunk's own CI (.github/workflows/build-test.yml) and
      # avoiding MinGW-vs-sol2/grunk header conflicts (e.g. NOMINMAX redefinition
      # warnings from grunk/plugin/loader.cpp under MinGW's own os_defines.h).
      - name: Set up Visual Studio shell
        if: startsWith(matrix.os, 'windows')
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true

      # grunk is a real from-source build now (find_package(grunk REQUIRED) against
      # scripts/install_grunk.cmake's own .deps/grunk - see CMakeLists.txt's own
      # comment for why this replaced FetchContent-vendoring grunk's source), so
      # .deps/grunk is cached across runs the same way .deps/adolc/.deps/adocct
      # already are below, keyed on the install script (its own idempotency check -
      # see its top comment - is what makes a cache hit skip straight past the
      # actual build).
      - name: Cache grunk
        uses: actions/cache@v6
        with:
          path: .deps/grunk
          key: ${{ runner.os }}-grunk-${{ hashFiles('scripts/install_grunk.cmake') }}

      - name: Install grunk
        run: pixi run -e default install_grunk

      - name: Configure
        run: pixi run -e default configure Release

      - name: Build
        run: pixi run -e default build

      - name: Test
        run: pixi run -e default test

      - name: Run examples
        run: pixi run -e default run_examples

      - name: Install
        run: pixi run -e default install

  # AD-enabled build (see README.md's "Building with AD support" and DESIGN.md's "AD
  # validation milestone") - Linux-only, matching pixi.toml's `ad` feature. ADOL-C/
  # adOCCT and grunk are all real from-source builds (autotools + a full OCCT build,
  # and find_package(grunk REQUIRED) against scripts/install_grunk.cmake's own
  # .deps/grunk-ad respectively - see CMakeLists.txt's own comment for why grunk is
  # no longer FetchContent-vendored), so .deps/adolc, .deps/adocct, and .deps/
  # grunk-ad are all cached across runs, keyed on their own install scripts (each
  # script's own idempotency check - see its top comment - is what makes a cache
  # hit skip straight past the actual build) rather than rebuilding from scratch on
  # every PR. A cache miss (first run, or any of the three scripts changes) still
  # takes a while - that cost is inherent to building a full OCCT fork (and grunk
  # itself) from source, not something this workflow can avoid.
  build-and-test-ad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # autoreconf/automake/libtool for ADOL-C's own ./configure step (see
      # scripts/install_adolc.sh's own top comment) - present on GitHub's ubuntu-
      # latest runner image already, installed explicitly anyway so this job doesn't
      # depend on that undocumented, changeable image content.
      - name: Install autotools and X11 dev headers
        # libx11-dev et al.: adOCCT is a full from-source OCCT build, and
        # OCCT's own CMakeLists.txt pulls TKService (X11/Xlib.h) in
        # transitively via DataExchange's own STEP toolkits regardless of
        # whether Visualization is enabled - see scripts/install_adocct.sh's
        # own comment for how this was confirmed. That same script prunes the
        # rest of OCCT's module set (Visualization/ApplicationFramework/Draw)
        # that this plugin doesn't need - this apt step and that pruning are
        # both a stopgap for building adOCCT from source in CI at all, see
        # DESIGN.md's "AD validation milestone" section for when/how to
        # remove both once prebuilt binaries exist.
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool libx11-dev libxmu-dev libxi-dev libxt-dev

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true

      - name: Cache ADOL-C/adOCCT/grunk
        uses: actions/cache@v6
        with:
          path: |
            .deps/adolc
            .deps/adocct
            .deps/grunk-ad
          key: ${{ runner.os }}-adolc-adocct-grunk-ad-${{ hashFiles('scripts/install_adolc.sh', 'scripts/install_adocct.sh', 'scripts/install_grunk.cmake') }}

      - name: Install grunk
        run: pixi run -e ad install_grunk

      - name: Install ADOL-C
        run: pixi run -e ad install_adolc

      - name: Install adOCCT
        run: pixi run -e ad install_adocct

      - name: Configure
        run: pixi run -e ad configure Release

      - name: Build
        run: pixi run -e ad build

      - name: Test
        run: pixi run -e ad test

      - name: Run examples
        run: pixi run -e ad run_examples

      - name: Install
        run: pixi run -e ad install

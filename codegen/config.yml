# Declarative generator config (see DESIGN.md and codegen/README.md): one entry per
# OCCT "module", each naming the headers to wrap (a glob pattern or a literal
# filename - see codegen/README.md's "Wildcard header patterns"; a header may define
# more than one class/struct/enum/namespace - see "Lifting the one-class-per-header
# assumption") and a blacklist of specific ClassName::MethodName (or bare
# ClassName/EnumName) symbols to exclude, each with a reason.
#
# Revives legacy grocc's config.yml.in shape (modules -> headers -> blacklist),
# repointed at the new register_type/add_constructors/add_member_function API - see
# grocc/config.yml.in for the legacy version this is modeled on.

# Translation-unit grouping for the build (see generate.py's compute_translation_units
# and CMakeLists.txt's own comment on generated/translation_units.txt).
#
# mode: separate (this project's default) compiles each module as its own
# translation unit - keeps any single compiler invocation's own memory/time bounded
# regardless of how large the whole plugin's generated code grows (found the hard
# way: a single all-modules-in-one-TU build peaked at ~12-13GB RAM and ~4 minutes for
# just this one file, reliably OOM-killing GitHub Actions' ubuntu-latest CI runners -
# see DESIGN.md's "Translation-unit grouping" section). mode: unity instead compiles
# every module *and* src/occt_plugin.cpp into exactly one translation unit - this
# project's original, simplest design, kept available as an opt-out for anyone who
# wants it (e.g. a from-scratch build on a machine with plenty of RAM might compile
# faster overall in unity mode, having to invoke the compiler only once).
#
# groups (consulted under either mode) lists sets of modules that must compile
# together regardless: gc's own GC_MakeSegment::Value()/GC_MakeCircle::Value()
# return Handle(Geom_TrimmedCurve)/Handle(Geom_Circle), and geomapi's own
# GeomAPI_IntCS::Segment/GeomAPI_IntSS::Line return Handle(Geom_Curve) - all types
# registered in geom, not gc/geomapi themselves - and Handle(X)-returning code only
# compiles correctly in the same translation unit as X's own
# register_type<X, ...>() call (confirmed empirically, see DESIGN.md). Add a module
# here immediately if a similar no-match-for-operator</operator== compile error
# ever appears after adding a new module - it means that module returns some other
# module's Handle(X) type too.
#
# brep/brepfilletapi joined this group for exactly that reason: registering
# Geom_Surface (geom module, for Geom_BSplineSurface's own
# ExchangeUV) newly type-accepted BRep_Tool::Surface (brep) and
# BRepFilletAPI_MakeFillet::ComputedSurface (brepfilletapi), both of which return
# Handle(Geom_Surface) - previously rejected outright (Geom_Surface wasn't a
# registered type at all), so this never came up before.
translation_units:
  mode: separate
  groups:
    - [gc, geom, geomapi, brep, brepfilletapi]

modules:
  - name: gp
    # gp_*.hxx (all ~40 headers, not the original hand-picked 5) - matches legacy
    # grocc's own config.yml.in convention directly. gp_TrsfForm/gp_EulerSequence
    # are plain enums, registered via the generator's new_enum(...) support (see
    # codegen/README.md's "Enum support") rather than rejected outright.
    headers:
      - gp_*.hxx
    blacklist:
      # Deliberately blacklisted rather than actually unwrappable - BaryCenter is
      # real, accepted by the type filter, and not needed by any target recipe
      # today.
      - gp_Pnt::BaryCenter
      # A gp_Vec/gp_Vec2d constructed from a null-magnitude direction throws this
      # exception type (Standard_DomainError-derived) - not a geometric value type
      # in its own right. Re-derived fresh rather than just carrying legacy
      # grocc's own identical blacklist entry forward: it has
      # no accepted constructor of its own (its only one takes no arguments and
      # would need real exception-object construction semantics this generator
      # doesn't model), so it would register as an empty, useless type either way.
      - gp_VectorWithNullMagnitude

  - name: geom
    # Standard_Transient/Handle(T) detection + add_bases<...>() for inheritance
    # chains, exercised here on something Transient-derived but array-free
    # (Geom_Line). Order matters for readability here: base classes first, so the
    # generated .cpp registers Geom_Geometry before Geom_Curve before
    # Geom_Line/Geom_BoundedCurve/Geom_BezierCurve (natural reading order, though
    # sol2's add_bases doesn't strictly require it).
    #
    # Geom_BoundedCurve/Geom_BezierCurve exercise collection support: the
    # generator registers Geom_BezierCurve itself generically, including its own
    # constructors - both take a TColgp_Array1OfPnt const&, accepted via the
    # generator's NCollection_Array1<X> parameter support (see codegen/README.md's
    # "NCollection_Array1/2 support"), converting through src/collections.hpp's
    # to_array1<gp_Pnt>() and never exposing that OCCT array type to Lua directly.
    #
    # Geom_TrimmedCurve/Geom_Conic/Geom_Circle are the "gc" module's own
    # prerequisites (GC_MakeSegment::Value() returns Handle(Geom_TrimmedCurve),
    # GC_MakeCircle::Value() returns Handle(Geom_Circle)) - genuine Geom_* classes
    # in the same inheritance family as everything else here, registered here
    # rather than in "gc" itself (Geom_Conic has no accepted members of its own
    # yet - gp_Ax2/gp_Elips-taking methods, unregistered - same as the
    # empty-but-necessary Geom_Geometry/Geom_Curve above it in the chain). Safe to
    # keep "gc" as its own separate module/generated file despite this cross-module
    # Handle(X) reference: see CMakeLists.txt's unity-build note and DESIGN.md's
    # "Handle(X) return type requires being in the same translation unit as X" for
    # why that would otherwise be a real, confirmed compile error.
    #
    # Widened from a hand-picked header list to the full Geom_*.hxx wildcard plus
    # GeomConvert.hxx, matching legacy grocc's own config.yml.in - found by
    # directly diffing the class lists both generators actually produce
    # (legacy-grocc/generated/Geom.cpp vs. this module's own output), not by
    # re-reading either config. ~23 real analytic-geometry classes (Geom_Plane,
    # Geom_CylindricalSurface, Geom_Ellipse, Geom_Hyperbola, Geom_Parabola, the
    # Geom_Axis1Placement/Axis2Placement/AxisPlacement family,
    # Geom_Transformation, Geom_OffsetCurve/OffsetSurface, ...) were never
    # reachable from Lua at all - not because of any deliberate exclusion, nobody
    # had needed them yet. GeomConvert (curve/surface-to-BSpline conversion
    # utilities - SplitBSplineCurve/Surface, CurveToBSplineCurve,
    # SurfaceToBSplineSurface) is a genuinely useful static "namespace class",
    # same shape as BRepTools/TopoDS - legacy grocc wrapped it explicitly, this
    # module never had it at all. GeomConvert::ConcatG1/ConcatC1 (mutable
    # TColGeom_Array1OfBSplineCurve&/TColStd_HArray1OfInteger& out-params) stay
    # rejected - genuinely unsupported by this generator, not a regression.
    #
    # The original hand-picked list (Geom_Geometry/Curve/Line/BoundedCurve/
    # BezierCurve/BSplineCurve/TrimmedCurve/Conic/Circle/Surface/BoundedSurface/
    # BSplineSurface/BezierSurface) is a strict subset of what the wildcard now
    # produces - every one of those earlier, validation-driven additions is still
    # covered, this only adds more, never removes anything.
    headers:
      - Geom_*.hxx
      - GeomConvert.hxx
    # extra_includes: needed once the gp module's own wildcard expansion
    # registered gp_Lin/gp_Circ/gp_Ax2 - several Geom_* methods return/take them by
    # value (Geom_Line::Lin, Geom_Circle::Circ, Geom_Conic::SetAxis/Position, ...),
    # newly accepted now that those types are registered, but this module's own
    # headers only forward-declare them (e.g. Geom_Line.hxx's `class gp_Lin;`) -
    # same reasoning as bnd/brep/breptools/toploc's own extra_includes. gp_GTrsf2d
    # is the same story for Geom_Surface::ParametricTransformation - gp_Mat2d.hxx
    # (already transitively included) only forward-declares it (`friend class
    # gp_GTrsf2d;`).
    extra_includes:
      - gp_Lin.hxx
      - gp_Circ.hxx
      - gp_Ax2.hxx
      - gp_GTrsf2d.hxx

  - name: message_progress
    # Message_ProgressRange appears as a defaulted parameter across a large swath of
    # OCCT's own API (BRepTools::Write, BRepAlgoAPI_Cut's own constructor, ...).
    # Originally registered because the generator couldn't expand default arguments
    # at all (every parameter had to come from Lua, defaulted or not) - since the
    # generator gained default-argument expansion (see codegen/README.md and
    # DESIGN.md), most of those call sites now also have a shorter overload that
    # omits it entirely
    # and lets C++ apply the real default. Still worth keeping registered: it's a
    # real, useful escape hatch for the (rarer) call sites that genuinely want to
    # pass a real progress range explicitly (or where a *non-trailing* defaulted
    # parameter still forces it into the accepted arity), and this tiny,
    # always-default-constructible type costs nothing to keep around.
    headers:
      - Message_ProgressRange.hxx

  - name: topods
    # TopoDS_Shape is a plain VALUE type (not Standard_Transient-derived) - its leaf
    # subtypes (Face/Edge/Vertex/...) add no data, just type identity, via ordinary
    # (non-Handle) single inheritance. The same add_bases<...>() mechanism built
    # for Handle(T)/Transient inheritance turns out to generalize directly to
    # this case too (see DESIGN.md) - legacy grocc's manual "TopoDS_Shape gets extra
    # upcast constructors from every leaf type" workaround (custom_init.cpp) is not
    # needed here: a TopoDS_Face-typed value upcast-converts to a
    # `TopoDS_Shape const&` parameter automatically via its own add_bases<TopoDS_Shape>().
    #
    # TopoDS.hxx is a genuine C++ *namespace* (not a class - see codegen/README.md's
    # "Static-only 'namespace classes'" spike), providing the Face(shape)/Edge(shape)/
    # ... downcast helpers, each overloaded (const-ref-returning and mutable-ref-
    # returning) - registered as occt.TopoDS_Face(shape), occt.TopoDS_Edge(shape), ...
    headers:
      - TopoDS_Shape.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Wire.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS.hxx

  - name: brepbuilderapi
    # BRepBuilderAPI_Command's IsDone() and BRepBuilderAPI_MakeShape's Shape() are
    # what every BRepPrimAPI_Make*/BRepAlgoAPI_* algorithm class below actually
    # inherits and needs - registered here once, reached via add_bases from each of
    # them (same base-class-method-reuse pattern as Geom_Curve::Value).
    #
    # Widened from a hand-picked pair to the whole module (BRepBuilderAPI_*.hxx),
    # matching legacy grocc's own config.yml.in wildcard - needed to unlock
    # MakeEdge/MakeWire/MakePolygon/MakeFace/Transform for the ported example
    # recipes (examples/). Re-derives legacy's own two blacklist entries fresh
    # rather than carrying them forward uncritically:
    #   - BRepBuilderAPI_FastSewing: a protected nested class (legacy's own comment:
    #     "protected nested classes should not be considered by code generator") -
    #     confirmed still a real generator gap (this generator's own class-discovery
    #     walk has no public/protected distinction for *nested* class definitions
    #     the way it does for members - out of scope to fix here).
    #   - BRepBuilderAPI_BndBoxTreeSelector: needs Bnd_BoundSortBox/NCollection_UBTree
    #     internals, none registered - confirmed still unusable, kept blacklisted.
    #
    # Also includes the bare BRepBuilderAPI.hxx (the module's own static
    # "namespace class", same shape as BRepTools/TopoDS - default working-plane/
    # precision accessors), added after comparing this module's own generated
    # class list against legacy grocc's: the BRepBuilderAPI_*.hxx glob below never
    # matched it (no underscore after "BRepBuilderAPI" in the filename), an
    # easy-to-miss gap legacy grocc's own config.yml.in happened to avoid since its
    # equivalent glob (BRepBuilderAPI*.hxx, no underscore) is looser and matches
    # both.
    headers:
      - BRepBuilderAPI.hxx
      - BRepBuilderAPI_*.hxx
    # These four headers don't even parse standalone - each instantiates
    # NCollection_CellFilter<gp_XY> or NCollection_UBTree (BndBoxTreeSelector) without
    # gp_XY's own header, an incomplete-type error unrelated to any symbol this
    # generator would otherwise accept/reject (see expand_headers' own
    # exclude_headers doc comment - a hard header-level parse gap, not a
    # blacklist-able symbol; blacklist can't help here since it only excludes a
    # symbol *after* its header has already parsed). BRepBuilderAPI_FastSewing was
    # legacy grocc's own blacklist entry too (their stated reason: a protected
    # nested class its old generator couldn't handle) - re-confirmed here as
    # unusable for this more fundamental parse reason instead, still excluded.
    exclude_headers:
      - BRepBuilderAPI_CellFilter.hxx
      - BRepBuilderAPI_VertexInspector.hxx
      - BRepBuilderAPI_FastSewing.hxx
      - BRepBuilderAPI_BndBoxTreeSelector.hxx
    # extra_includes: the TopoDS_* entries are original; the gp_* ones
    # were added once a standalone-per-module build (not the old always-unity
    # build) actually compiled this module on its own and found each one only
    # forward-declared by whichever BRepBuilderAPI_*.hxx header takes it by
    # reference - see DESIGN.md's "Translation-unit grouping". Geom_Plane.hxx is
    # the same story for BRepBuilderAPI::Plane() - BRepBuilderAPI.hxx only
    # forward-declares it.
    extra_includes:
      - Geom_Plane.hxx
      - TopoDS_Shape.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Wire.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_Compound.hxx
      - TopoDS_CompSolid.hxx
      - gp_Circ.hxx
      - gp_Circ2d.hxx
      - gp_Cone.hxx
      - gp_Cylinder.hxx
      - gp_Elips.hxx
      - gp_Elips2d.hxx
      - gp_Hypr.hxx
      - gp_Hypr2d.hxx
      - gp_Lin.hxx
      - gp_Lin2d.hxx
      - gp_Parab.hxx
      - gp_Parab2d.hxx
      - gp_Pln.hxx
      - gp_Sphere.hxx
      - gp_Torus.hxx

  - name: brepprimapi
    # Reproduces legacy grocc's test_simple_boolean_op.cpp (box, cylinder, cut).
    # Widened to the whole module (see DESIGN.md) - matches legacy grocc's own
    # wildcard, needed to unlock MakeRevol/MakeHalfSpace/MakeSphere/MakePrism for
    # the ported example recipes.
    headers:
      - BRepPrimAPI_*.hxx

  - name: brepalgoapi
    # Widened to the whole module (see DESIGN.md) - matches legacy grocc's
    # own wildcard, needed to unlock Fuse/Common for the ported example recipes.
    # extra_includes: some BRepAlgoAPI_*.hxx header only forward-declares gp_Pln (a
    # reference parameter needs no more from its own point of view) - same class of
    # gap as bnd/brepbuilderapi's own extra_includes, found the same way (a
    # standalone-per-module build, not the old always-unity build, actually compiling
    # this module on its own - see DESIGN.md's "Translation-unit grouping").
    headers:
      - BRepAlgoAPI_*.hxx
    extra_includes:
      - gp_Pln.hxx

  - name: bnd
    #   - Bnd_Box is a plain value type (no Standard_Transient/Handle, no explicit
    #     destructor -> "value" ctor mode) bounded by gp_Pnt/gp_Dir/gp_Trsf (gp
    #     module) and itself (Add(Bnd_Box const&)); IsOut(gp_Lin const&)/
    #     IsOut(gp_Pln const&) are accepted now that gp's own wildcard registers
    #     gp_Lin/gp_Pln too - see this module's own extra_includes below,
    #     needed once these two overloads started being generated: Bnd_Box.hxx only
    #     forward-declares gp_Lin/gp_Pln (a reference parameter needs no more from
    #     its own point of view), same class of gap as BRepBndLib.hxx's own
    #     TopoDS_Shape below.
    #   - BRepBndLib is a static-only "namespace class" (see codegen/README.md's
    #     "Static-only 'namespace classes'") whose Add(shape, box&, ...) mutates the
    #     existing Bnd_Box userdata passed in - the same already-supported
    #     non-const-reference-to-a-registered-object out-param pattern
    #     Geom_Curve::D0 established (codegen/README.md's "Non-const-reference
    #     ('out') parameters").
    # extra_includes (see codegen/README.md's "extra_includes"):
    # BRepBndLib.hxx only forward-declares `class TopoDS_Shape;` (a reference
    # parameter needs no more from BRepBndLib.hxx's own point of view) - but sol2's
    # usertype binding for Add(shape, ...) needs TopoDS_Shape's *complete*
    # definition in this translation unit (generated/bnd.cpp), regardless of it
    # already being fully defined and registered elsewhere (generated/topods.cpp) -
    # found the hard way as a real "invalid use of incomplete type" compile error.
    #
    # Widened from Bnd_Box.hxx alone to the full Bnd_*.hxx wildcard, matching
    # legacy grocc's own config.yml.in and every other module here's own
    # widened-to-the-whole-module treatment - found by directly diffing this
    # module's own generated class list against legacy grocc's. Adds Bnd_Box2d
    # (the 2D counterpart), Bnd_OBB (oriented bounding box - now registers, unlike
    # before), Bnd_Sphere/Bnd_B2d/B2f/B3d/B3f (simpler bounding primitives),
    # Bnd_Range (1D interval), Bnd_Tools (a static "namespace class", same shape as
    # BRepBndLib itself), and Bnd_HArray1OfBox/Bnd_HArray1OfSphere (handle-wrapped
    # arrays built on the already-supported NCollection_Array1<X> mechanism, not
    # the old TCol*_H*-style handle arrays that stay unregistered - see this
    # repo's own "No NCollection type is ever exposed to Lua directly" policy,
    # DESIGN.md's "Collections" section). Bnd_BoundSortBox/BoundSortBox2d/
    # HArray1OfBox2d stay unregistered on their own merits (NCollection_UBTree
    # internals / Bnd_Box2d not itself array1-eligible respectively), not because
    # the wildcard failed to reach them.
    headers:
      - Bnd_*.hxx
      - BRepBndLib.hxx
    blacklist:
      # Bnd_OBB::GetVertex(gp_Pnt theP[8]) takes a fixed-size C array, a parameter
      # shape this generator has no support for at all (not a pointer/reference to
      # a single object, not an NCollection_Array1/2, not a std::vector) - its own
      # parameter-kind detection mistakenly treats it as callable with zero
      # arguments instead of rejecting it outright, which would otherwise silently
      # emit a broken zero-arg overload (a real compile error: OCCT's own
      # GetVertex has no such overload). Blacklisted until the generator gains
      # real C-array parameter support.
      - Bnd_OBB::GetVertex
    extra_includes:
      - TopoDS_Shape.hxx
      - gp_Lin.hxx
      - gp_Pln.hxx

  - name: brep
    # BRep_Builder constructs
    # topology; BRep_Tool inspects it - the two halves legacy grocc's own config
    # grouped as one "BRep" module. Both classes have a MUCH larger real API than
    # what's accepted here - most overloads take Geom_Surface/Geom2d_Curve/Poly_*/
    # gp_Pnt2d/TopLoc_Location/GeomAbs_Shape/TopAbs_ShapeEnum, none of which are
    # registered yet - only overloads built entirely from already-registered types
    # (TopoDS_*, gp_Pnt, Standard_Real/Integer/Boolean, and Geom_Curve - already
    # registered by the geom module, so e.g. BRep_Tool::Curve is *conceptually*
    # in reach, but both its overloads take Standard_Real& out-params for the
    # parameter range, still unsupported) are accepted:
    #   - BRep_Builder::MakeFace/MakeEdge/MakeVertex (undefined-geometry
    #     overloads), MakeVertex(V, gp_Pnt, Tol), UpdateVertex(V, gp_Pnt, Tol),
    #     UpdateFace/UpdateEdge(..., Tol), NaturalRestriction, SameParameter/
    #     SameRange/Degenerated, Range(E, First, Last, Only3d), Transfert - all
    #     mutate the registered TopoDS_Face/Edge/Vertex passed in, same
    #     non-const-reference-to-a-registered-object out-param pattern as Bnd's
    #     BRepBndLib::Add.
    #   - BRep_Tool::Pnt(vertex), Tolerance(face/edge/vertex - three overloads of
    #     one name, merged into one sol::overload since sol2 disambiguates by
    #     each overload's distinct registered-type argument), IsClosed(shape),
    #     IsClosed(edge, face), Parameter(vertex, edge[, face]), HasContinuity
    #     (edge, face, face).
    #   - BRep_Builder extends TopoDS_Builder (add_bases<TopoDS_Builder>() gets
    #     emitted). Correction (see DESIGN.md): TopoDS_Builder was
    #     originally left unregistered on the assumption that "nothing it declares
    #     is needed from Lua" - wrong, found while porting the example recipes
    #     (examples/): TopoDS_Builder::MakeCompound/MakeCompSolid/MakeWire/
    #     MakeShell/MakeSolid/Add/Remove are exactly the calls legacy grocc's own
    #     recipes use to assemble a TopoDS_Compound from several already-built
    #     shapes - genuinely useful, not dead weight. sol2's add_bases dispatch
    #     only reaches a base class's *own* methods if that base is itself
    #     registered (with real add_member_function calls) somewhere - it isn't
    #     enough for the C++ type to just be visible/complete for casting, contrary
    #     to this note's own prior (incorrect) claim. Now registered here, so
    #     `builder:MakeCompound(c)`/`builder:Add(c, shape)` etc. work via
    #     inheritance dispatch off a `BRep_Builder` instance.
    # extra_includes: all three headers forward-declare TopoDS_Shape/Face/Edge/
    # Vertex/Wire/Shell/Solid/CompSolid/Compound (sufficient for their own
    # reference/pointer-only usage) - sol2's usertype binding needs the complete
    # definitions, same reasoning as bnd's own extra_includes above.
    # No blacklist entries - nothing accepted here needs excluding. BRep_Tool::
    # Surface returns Handle(Geom_Surface) - see translation_units's own comment
    # above for why this module needed to join the
    # [gc, geom, geomapi] translation-unit group once Geom_Surface itself became
    # a registered type.
    headers:
      - BRep_Builder.hxx
      - BRep_Tool.hxx
      - TopoDS_Builder.hxx
    extra_includes:
      - TopoDS_Shape.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Face.hxx
      - TopoDS_Wire.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx

  - name: breptools
    # BRepTools is a static-only
    # "namespace class" (see codegen/README.md's "Static-only 'namespace classes'")
    # with a much larger real API than what's accepted - most overloads need
    # mutable Standard_Real&/Standard_Boolean& out-params (unsupported - no Lua-side
    # identity for a bare number/bool to mutate in place, same rule as everywhere
    # else), Standard_OStream&/Standard_CString (Write/Read/Dump - also why these
    # never collide with src/shape_io.hpp's own hand-written export_brep, which
    # exists for exactly this gap), or unregistered types
    # (TopTools_IndexedMapOfShape/ListOfShape, Handle(OSD_FileSystem),
    # TopAbs_Orientation, Handle(Geom2d_Curve)/Handle(Geom_Surface)). What's left is
    # still real, useful functionality: Update (9 overloads, one per TopoDS_* type),
    # UpdateFaceUVPoints, Clean/CleanGeometry/RemoveUnusedPCurves, Triangulation
    # (verifies deflection), Compare (Vertex/Edge overloads), OuterWire,
    # IsReallyClosed, UVBounds (now that Bnd_Box2d is registered too - see the bnd
    # module's own widened Bnd_*.hxx coverage), and RemoveInternals (mutates the
    # TopoDS_Shape passed in - same non-const-reference-to-a-registered-object
    # out-param pattern as everywhere else in this module sweep).
    # extra_includes: BRepTools.hxx forward-declares every TopoDS_* type it uses,
    # and Bnd_Box2d, by reference only, from its own header's point of view -
    # sol2's usertype binding needs their complete definitions, same reasoning as
    # bnd/brep above.
    # No blacklist entries.
    headers:
      - BRepTools.hxx
    extra_includes:
      - Bnd_Box2d.hxx
      - TopoDS_Shape.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Wire.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx

  - name: toploc
    # TopLoc_Location is a plain
    # value type (no explicit destructor -> "value" ctor mode) representing a
    # composite coordinate-system transform - buildable from a gp_Trsf (already
    # registered by the gp module). Only TopLoc_Location.hxx is
    # registered, not the whole legacy TopLoc_*.hxx glob: TopLoc_Datum3D/
    # ItemLocation/SListOfItemLocation/MapOfLocation/IndexedMapOfLocation/
    # MapIteratorOfMapOfLocation are TopLoc_Location's own internal implementation
    # detail types (hashing/list machinery), never meant to be exposed to Lua on
    # their own.
    #
    # This is a more consequential module than bnd/brep/breptools: TopLoc_Location
    # was previously *unregistered*, so every earlier module's TopLoc_Location&/
    # const& parameter (BRep_Builder::MakeFace/MakeEdge/UpdateEdge/Continuity/...,
    # BRep_Tool::Surface/Curve/Triangulation/Range/UVPoints/..., BRepTools::
    # UVBounds's siblings) was rejected purely for that reason - regenerating with
    # this module present retroactively accepts a real batch of those (recorded in
    # DESIGN.md's own note, not re-derived here to avoid this comment going stale
    # the next time codegen runs).
    # No blacklist entries - operator*/operator/ are skipped automatically (name
    # prefix, see codegen/README.md's "Known gaps"), nothing else needed excluding.
    headers:
      - TopLoc_Location.hxx

  - name: gc
    # GC_MakeSegment/GC_MakeCircle are
    # two of the legacy "GC" module's construction-algorithm classes (see legacy
    # grocc's config.yml.in) - value types (no explicit destructor), both extending
    # GC_Root (registered here too, so add_bases<GC_Root>() dispatch can actually
    # reach IsDone() from a Lua instance - same reasoning as registering
    # Geom_Geometry/Geom_Curve purely so add_bases has something real to find,
    # Status() -> gce_ErrorType stays rejected, unregistered enum).
    #   - GC_MakeSegment(gp_Pnt, gp_Pnt) -> Value() -> Handle(Geom_TrimmedCurve) -
    #     the other three constructors need gp_Lin, unregistered, rejected.
    #   - GC_MakeCircle: 4 of its 7 constructors are accepted (three-point
    #     (gp_Pnt,gp_Pnt,gp_Pnt), center+normal+radius (gp_Pnt,gp_Dir,Standard_Real),
    #     center+point-on-axis+radius (gp_Pnt,gp_Pnt,Standard_Real), and
    #     axis+radius (gp_Ax1,Standard_Real)) - the rest need gp_Circ/gp_Ax2,
    #     unregistered. Value() -> Handle(Geom_Circle) - see geom module's own
    #     Geom_Conic/Geom_Circle addition, made specifically for this. Both Value()
    #     methods return their Handle(X) *by reference* in real OCCT
    #     (const Handle(X)&) - the generator emits these as a by-value return
    #     instead (see codegen/README.md's own note on this), and this module also
    #     only compiles safely *because* of the unity build (CMakeLists.txt) -
    #     GC_MakeSegment/GC_MakeCircle live in their own generated file, separate
    #     from Geom_TrimmedCurve/Geom_Circle's own registration in geom.cpp; without
    #     the unity build, this is a real, confirmed compile error (see DESIGN.md) -
    #     see translation_units.groups above, listing gc/geom together for exactly
    #     this reason.
    # extra_includes: several GC_Make*.hxx headers (GC_MakeCylindricalSurface,
    # GC_MakeConicalSurface, ...) take a gp_* parameter that header only
    # forward-declares (via a transitive Geom_*Surface.hxx include) - every type
    # listed below is one of those, confirmed one at a time via a standalone build
    # of this module. This was NOT caught by "confirmed by building" under the old
    # always-unity build (see DESIGN.md's "Translation-unit grouping"): that only
    # ever proved gc.cpp compiles *concatenated with everything else*, including
    # gp.cpp's own #include <gp_Cylinder.hxx> etc. - not that it compiles standalone.
    #
    # Widened from the two hand-picked classes above to the whole module
    # (GC_*.hxx, see DESIGN.md) - matches legacy grocc's own config.yml.in
    # wildcard, needed to unlock GC_MakeArcOfCircle for the ported example
    # recipes (examples/).
    # No blacklist entries.
    headers:
      - GC_*.hxx
    extra_includes:
      - gp_Circ.hxx
      - gp_Cone.hxx
      - gp_Cylinder.hxx
      - gp_Elips.hxx
      - gp_Hypr.hxx
      - gp_Lin.hxx
      - gp_Parab.hxx
      - gp_Pln.hxx

  - name: brepoffsetapi
    # Legacy grocc's own config.yml.in
    # wildcarded this whole module (BRepOffsetAPI_*.hxx) with one blacklist entry
    # (BRepOffsetAPI_FindContigousEdges - a Windows link error, undefined symbol
    # NbEdges); re-derived fresh rather than carried forward
    # uncritically - see DESIGN.md for what actually got accepted/rejected and
    # whether that same entry is still warranted here (a real OCCT bug in that
    # class, not a toolchain/generator artifact, so it likely still applies, but
    # confirmed rather than assumed).
    headers:
      - BRepOffsetAPI_*.hxx
    blacklist:
      - BRepOffsetAPI_FindContigousEdges

  - name: geomapi
    # Legacy grocc's own
    # config.yml.in wildcarded this whole module (GeomAPI_*.hxx) too, with one
    # blacklist entry (GeomAPI_Interpolate::ClearTangents - a Windows link error,
    # legacy's own comment notes the definition seems to be missing from OCCT's own
    # GeomAPI_Interpolate.cxx); re-derived fresh rather than
    # carried forward uncritically - see DESIGN.md for whether it's still warranted
    # here (a real OCCT library gap, not a toolchain/generator artifact, so likely
    # still applies, but confirmed rather than assumed).
    headers:
      - GeomAPI_*.hxx
    blacklist:
      - GeomAPI_Interpolate::ClearTangents
      # A real, new generator gap found here (see DESIGN.md): each of these three
      # holds an Extrema_Ext{CC,CS,PS} member whose own implicit move/copy
      # constructor is deleted (a private field deep in its own dependency chain
      # forces this) - but none of the three has an *explicit* destructor of its
      # own or in its base chain, so owns_resource_unsafely's existing heuristic
      # (which only checks for that) doesn't route them to the unique_ptr ctor
      # mode, and the plain by-value ctor mode fails to compile. Detecting genuine
      # move/copy-constructibility would need full semantic analysis libclang's
      # cursor-level AST walk doesn't give us - out of scope for this pass;
      # blacklisted as bare class names rather than taught to the generator.
      - GeomAPI_ExtremaCurveCurve
      - GeomAPI_ExtremaCurveSurface
      - GeomAPI_ProjectPointOnSurf

  - name: brepfilletapi
    # Legacy grocc's own config.yml.in
    # wildcarded this whole module (BRepFilletAPI_*.hxx) with no blacklist entries
    # at all - re-derived fresh (verified rather than just
    # carried forward, per this repo's own stated practice), and confirmed to still
    # need none.
    headers:
      - BRepFilletAPI_*.hxx

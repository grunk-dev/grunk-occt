# Declarative generator config (see DESIGN.md and codegen/README.md): one entry per
# OCCT "module", each naming the headers to wrap (one class per header, matched by
# filename stem - true for every gp_* header) and a blacklist of specific
# ClassName::MethodName (or bare ClassName) symbols to exclude, each with a reason.
#
# Revives legacy grocc's config.yml.in shape (modules -> headers -> blacklist),
# repointed at the new register_type/add_constructors/add_member_function API - see
# grocc/config.yml.in for the legacy version this is modeled on.

modules:
  - name: gp
    headers:
      - gp_Pnt.hxx
      - gp_Vec.hxx
      - gp_Dir.hxx
      - gp_Ax1.hxx
      - gp_Trsf.hxx
    blacklist:
      # Step 2 checkpoint (see DESIGN.md/migration plan): deliberately blacklisted to
      # prove the mechanism works end to end, not because it's actually unwrappable -
      # BaryCenter is real, accepted by the type filter, and not needed by any target
      # recipe today.
      - gp_Pnt::BaryCenter

  - name: geom
    # Step 3 validation module (see DESIGN.md/migration plan): Standard_Transient/
    # Handle(T) detection + add_bases<...>() for inheritance chains, on something
    # Transient-derived but array-free (Geom_Line). Order matters here: base classes
    # first, so the generated .cpp registers Geom_Geometry before Geom_Curve before
    # Geom_Line/Geom_BoundedCurve/Geom_BezierCurve (natural reading order, though
    # sol2's add_bases doesn't strictly require it).
    #
    # Geom_BoundedCurve/Geom_BezierCurve are the Step 5 validation case (collections -
    # see DESIGN.md/migration plan): the generator registers Geom_BezierCurve itself
    # generically (add_bases<Geom_BoundedCurve, Geom_Curve, Geom_Geometry>() reaches
    # Value/D0/D1/D2/D3/... via inheritance, and NbPoles/Pole/Degree/IsRational/
    # StartPoint/EndPoint/Transform/Copy/Weight are all accepted directly, same as any
    # other module), but both of Geom_BezierCurve's own constructors take a
    # TColgp_Array1OfPnt const& - an OCCT array type the generator has no concept of
    # (see codegen/README.md's "Known gaps") - so it ends up with zero accepted
    # constructors, exactly like the abstract classes above it in the chain. The
    # hand-written `bezier_curve` free function (src/geom/bezier.hpp) is therefore the
    # only way to actually construct one from Lua, converting through
    # src/collections.hpp's to_array1<gp_Pnt>() rather than ever exposing
    # TColgp_Array1OfPnt to Lua directly.
    headers:
      - Geom_Geometry.hxx
      - Geom_Curve.hxx
      - Geom_Line.hxx
      - Geom_BoundedCurve.hxx
      - Geom_BezierCurve.hxx

  - name: message_progress
    # Message_ProgressRange appears as a defaulted parameter across a large swath of
    # OCCT's own API (BRepTools::Write, BRepAlgoAPI_Cut's own constructor, ...) - this
    # generator doesn't expand default arguments (see codegen/README.md's "Known
    # gaps"), so every parameter must be supplied explicitly from Lua. Registering
    # this tiny, always-default-constructible type (rather than teaching the
    # generator default-argument expansion) unlocks all of those call sites at once.
    headers:
      - Message_ProgressRange.hxx

  - name: topods
    # TopoDS_Shape is a plain VALUE type (not Standard_Transient-derived) - its leaf
    # subtypes (Face/Edge/Vertex/...) add no data, just type identity, via ordinary
    # (non-Handle) single inheritance. The same add_bases<...>() mechanism Step 3
    # built for Handle(T)/Transient inheritance turns out to generalize directly to
    # this case too (see DESIGN.md) - legacy grocc's manual "TopoDS_Shape gets extra
    # upcast constructors from every leaf type" workaround (custom_init.cpp) is not
    # needed here: a TopoDS_Face-typed value upcast-converts to a
    # `TopoDS_Shape const&` parameter automatically via its own add_bases<TopoDS_Shape>().
    #
    # TopoDS.hxx is a genuine C++ *namespace* (not a class - see codegen/README.md's
    # "Static-only 'namespace classes'" spike), providing the Face(shape)/Edge(shape)/
    # ... downcast helpers, each overloaded (const-ref-returning and mutable-ref-
    # returning) - registered as occt.TopoDS_Face(shape), occt.TopoDS_Edge(shape), ...
    headers:
      - TopoDS_Shape.hxx
      - TopoDS_Vertex.hxx
      - TopoDS_Edge.hxx
      - TopoDS_Wire.hxx
      - TopoDS_Face.hxx
      - TopoDS_Shell.hxx
      - TopoDS_Solid.hxx
      - TopoDS_CompSolid.hxx
      - TopoDS_Compound.hxx
      - TopoDS.hxx

  - name: brepbuilderapi
    # BRepBuilderAPI_Command's IsDone() and BRepBuilderAPI_MakeShape's Shape() are
    # what every BRepPrimAPI_Make*/BRepAlgoAPI_* algorithm class below actually
    # inherits and needs - registered here once, reached via add_bases from each of
    # them (same base-class-method-reuse pattern as Step 3's Geom_Curve::Value).
    headers:
      - BRepBuilderAPI_Command.hxx
      - BRepBuilderAPI_MakeShape.hxx

  - name: brepprimapi
    # Step 4b validation module: reproduces legacy grocc's test_simple_boolean_op.cpp
    # (box, cylinder, cut).
    headers:
      - BRepPrimAPI_MakeBox.hxx
      - BRepPrimAPI_MakeCylinder.hxx

  - name: brepalgoapi
    headers:
      - BRepAlgoAPI_Cut.hxx

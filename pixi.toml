[workspace]
name = "grunk-occt"
version = "0.1.0"
description = "OpenCASCADE (OCCT) plugin for grunk"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
# The `default` environment's own build tooling (see [environments] at the bottom) -
# `occt` itself is deliberately *not* here - see [feature.occt.dependencies] below -
# so it stays possible to keep it out of a different environment entirely (see
# [feature.ad] - a full, independent copy of this same list, deliberately *not*
# shared via implicit-default-feature inheritance: see that section's own comment
# for why).
cmake = "*"
ninja = "*"
lua = "*"
sol2 = "*"
taskflow = "*"
yaml-cpp = "*"
libparametric = "*"
python = ">=3.9"
gtest = "*"
# tests/python/test_hooks.py - unit tests for this plugin's own
# codegen/hooks.py CodeGenerator subclass (see [tasks]'s own test_hooks task).
pytest = "*"

[pypi-dependencies]
# grunk's own Python bindings, needed by examples/run_example.py (see its own
# README.md) - built from source (scikit-build-core + nanobind, per grunk's own
# pyproject.toml) since grunk has no published PyPI release yet (same reason
# CMakeLists.txt's own find_package(grunk) doesn't pin a commit itself - whatever's
# installed at .deps/grunk is what it finds - so this pin and scripts/
# install_grunk.cmake's own GRUNK_REV are the two that must move together, never
# independently, or the C++ occt_plugin.so and the Python `grunk` package loading it
# could disagree about the plugin ABI. grunk's own CMakeLists.txt builds
# grunk_recipe/grunk_plugin as SHARED libraries now, so this pip-installed copy
# dynamically links its own bundled copy of them rather than statically embedding
# one - see grunk's own CMakeLists.txt for why that matters.
#
# Also the sole source of the `generate_code` task's own runtime needs now
# (previously this repo's own direct libclang/pyyaml pins, removed): the `grunk`
# console script and its libclang/pyyaml dependencies come along transitively with
# this same pin, since grunk.codegen (grunk/python/grunk/codegen/) now lives in the
# grunk package itself rather than a local codegen/generate.py copy here.
grunk = { git = "https://github.com/grunk-dev/grunk.git", rev = "6bf642412c7d501101585a41370050386551f759" }

# Stock OCCT - only pulled in by the `default` environment (see [environments]).
# Kept out of [dependencies] specifically so the `ad` environment (adOCCT instead,
# see [feature.ad] below) never installs it at all - the two OCCT builds have no
# business coexisting in the same environment's own package set.
[feature.occt.dependencies]
occt = { version = "==7.9.3", build = "novtk_*" }

# AD-enabled build (Step 7, see DESIGN.md/README.md's "Building with AD support") -
# Linux-only, the one accepted platform exception in the migration plan; restricting
# the feature itself to linux-64 (rather than gating every task under
# [target.linux-64.tasks] as before) means `pixi run -e ad ...` simply isn't
# resolvable at all on macOS/Windows, instead of resolving and then failing.
#
# This feature does *not* inherit [dependencies]/[tasks]/[pypi-dependencies]/
# [target.linux-64.activation.env] above at all (see its `no-default-feature = true`
# in [environments]) - full isolation, not just "occt swapped for adOCCT": tried the
# implicit-inheritance version of this first (`ad = { features = ["ad"] }`, no
# `no-default-feature`), and it silently made every task the two environments happen
# to share by name (configure/build/test/all, but also generate_code/run_examples,
# which were never meant to differ per environment at all) *ambiguous* - `pixi run
# build` on its own no longer resolves without an explicit `-e default`/`-e ad`,
# breaking every existing bare `pixi run <task>` call site (this repo's own CI,
# README.md). Re-declaring the shared toolchain deps/activation env below instead
# keeps the `ad` environment*'s own task set completely separate from `default`'s -
# `pixi run build`/`test`/etc. (no `-e`) keep meaning "the default environment", the
# same as before this environment split existed, and only `-e ad` ever sees the
# AD-specific task definitions. Yes, this duplicates the toolchain dependency list
# from [dependencies] above - the accepted cost of that isolation, not an oversight.
[feature.ad]
platforms = ["linux-64"]

[feature.ad.dependencies]
cmake = "*"
ninja = "*"
lua = "*"
sol2 = "*"
taskflow = "*"
yaml-cpp = "*"
libparametric = "*"
python = ">=3.9"
gtest = "*"
# find_package(PkgConfig REQUIRED) in CMakeLists.txt (GRUNK_OCCT_ENABLE_AD branch
# only) uses this to locate ADOL-C via its own adolc.pc.
pkg-config = "*"
# scripts/install_adocct.sh's own adOCCT configure needs this directly, despite
# that script's own comment assuming it comes transitively via conda-forge's
# `occt` package - this environment is fully isolated (no-default-feature =
# true) and never pulls in `default`'s own `occt` dependency at all, so there is
# no such transitive closure here. Missing here is why `pixi run -e ad
# install_adocct` failed in CI with "Could NOT find Freetype" (3RDPARTY_FREETYPE_
# INCLUDE_DIR_ft2build/freetype2) - confirmed by reading the CMake configure
# output directly, not assumed.
freetype = "*"
# grunk's own Python bindings - needed for this environment's own run_examples task
# (examples/run_example.py), same as the default environment's own copy of this
# dependency in [pypi-dependencies] above (kept in sync manually - see that
# comment for the pin's own rationale). codegen/ is opt-in and only ever run
# against the default environment (see [tasks]'s own generate_code, not
# duplicated into [feature.ad.tasks] either) - this environment never needs the
# libclang/pyyaml that comes along transitively with grunk's own default-feature
# copy of this pin for that reason.
[feature.ad.pypi-dependencies]
grunk = { git = "https://github.com/grunk-dev/grunk.git", rev = "6bf642412c7d501101585a41370050386551f759" }

[feature.ad.activation.env]
# Needed for the same reason [target.linux-64.activation.env]'s own copy is - cmake's
# own package discovery (find_package(parametric REQUIRED) etc.) via this
# environment's own $CONDA_PREFIX (.pixi/envs/ad, not .pixi/envs/default).
# .deps/grunk-ad (not .deps/grunk - see [feature.ad.tasks]'s own install_grunk and
# scripts/install_grunk.cmake's own comment: this environment's grunk install must be
# built against *this* conda environment's own Lua/yaml-cpp, not `default`'s).
#
# SKBUILD_CMAKE_DEFINE below (missing here until found the hard way: bumping this
# feature's own [feature.ad.pypi-dependencies] grunk pin above - previously stale,
# never bumped past the very first commit this project pinned - was what actually
# triggered a rebuild at the new commit for the first time, since pixi only
# rebuilds a pypi git dependency when its pin changes) - grunk's default CMake
# option GRUNK_WITH_TASKFLOW=ON pulls in Taskflow, whose use of C++20
# `concept`/`iter_value_t` etc. fails to compile in this environment (same finding
# as [target.linux-64.activation.env]'s own copy of this override, and
# grunk-adolc's own identical override - neither of *those* is scoped to only the
# default environment the way this one accidentally was).
CMAKE_PREFIX_PATH = "$CONDA_PREFIX:$PIXI_PROJECT_ROOT/.deps/grunk-ad"
SKBUILD_CMAKE_DEFINE = "GRUNK_WITH_TASKFLOW=OFF"
# .deps/adolc and .deps/adocct - ADOL-C's own libadolc.so and adOCCT's own build of
# OCCT's shared libraries - used to be activated via LD_LIBRARY_PATH/PKG_CONFIG_PATH
# for *every* pixi task (see git history), which was a real bug, not just untidy:
# once `pixi run install_adocct` actually populated .deps/adocct/lib, having it on
# every task's LD_LIBRARY_PATH meant a plain, non-AD libocct_plugin.so could dlopen
# and resolve its OCCT symbols against adOCCT's differently-built libraries instead
# of conda-forge's stock `occt` package - version-skewed and silently wrong
# (surfaced as an undefined-symbol error, BOPAlgo_Algo::fillPIConstants, only when
# run through `pixi run`, never through a raw `ctest` next to it). Scoping this to
# the `ad` feature's own activation - which only the `ad` environment ever loads -
# fixes that at the root: the default environment's own activation never sees these
# paths at all now, not even via LD_LIBRARY_PATH being merely unset/harmless.
LD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/.deps/adolc/lib64:$PIXI_PROJECT_ROOT/.deps/adolc/lib:$PIXI_PROJECT_ROOT/.deps/adocct/lib64:$PIXI_PROJECT_ROOT/.deps/adocct/lib:$LD_LIBRARY_PATH"
PKG_CONFIG_PATH = "$PIXI_PROJECT_ROOT/.deps/adolc/lib64/pkgconfig:$PIXI_PROJECT_ROOT/.deps/adolc/lib/pkgconfig:$PKG_CONFIG_PATH"

[target.win-64.activation.env]
# .deps/grunk appended (`;`-separated - Windows' own PATH-list convention, unlike
# the `:` used on Linux/macOS below) - see [target.linux-64.activation.env]'s own
# comment (find_package(grunk REQUIRED), CMakeLists.txt, scripts/install_grunk.cmake).
CMAKE_PREFIX_PATH = "%CONDA_PREFIX%/Library;%PIXI_PROJECT_ROOT%/.deps/grunk"
# Needed only while building grunk's Python bindings above: grunk's default CMake
# option GRUNK_WITH_TASKFLOW=ON pulls in Taskflow, whose use of C++20
# `concept`/`iter_value_t` etc. fails to compile in this environment (found the hard
# way - not a grunk-occt problem, grunk's own default build hits it too) -
# CMakeLists.txt's own FetchContent of grunk already disables this
# (`GRUNK_WITH_TASKFLOW OFF`) for the C++ side, since occt_plugin never needs
# Taskflow's multithreaded grunk::core execution either; this is the equivalent
# override for the separate pip/scikit-build-core build of grunk's Python package
# (SKBUILD_CMAKE_DEFINE is scikit-build-core's own documented env-var override for a
# CMake -D define - see its settings/sources.py). grunk's own find_package(parametric
# REQUIRED) needs no separate parametric_DIR - conda-forge's libparametric package
# (already a dependency, above) ships its CMake config under this same
# CMAKE_PREFIX_PATH entry, which CMake's own config-mode search already checks.
SKBUILD_CMAKE_DEFINE = "GRUNK_WITH_TASKFLOW=OFF"

[target.linux-64.activation.env]
# .deps/grunk - where scripts/install_grunk.cmake installs grunk (see CMakeLists.txt's
# own find_package(grunk REQUIRED) comment for why this replaced FetchContent-
# vendoring grunk's source) - appended after $CONDA_PREFIX so CMake's own
# config-mode search still checks the conda environment first for everything else
# (Lua, yaml-cpp, parametric, ...), matching every other CMAKE_PREFIX_PATH entry in
# this project.
CMAKE_PREFIX_PATH = "$CONDA_PREFIX:$PIXI_PROJECT_ROOT/.deps/grunk"
SKBUILD_CMAKE_DEFINE = "GRUNK_WITH_TASKFLOW=OFF"

[target.osx-64.activation.env]
# .deps/grunk appended - see [target.linux-64.activation.env]'s own comment.
CMAKE_PREFIX_PATH = "$CONDA_PREFIX:$PIXI_PROJECT_ROOT/.deps/grunk"
# CMAKE_OSX_DEPLOYMENT_TARGET=13.3 works around a real macOS SDK availability gap,
# unrelated to GRUNK_WITH_TASKFLOW above: scikit-build-core's own wheel build
# defaults to a conservative `-mmacosx-version-min=13.0` (redistributable-wheel
# convention, unlike grunk-occt's own plain CMake build above, which just inherits
# the ambient toolchain's much newer native default and never hits this) - but
# grunk/core/parametric_core.hpp's own std::to_chars(double, ...) call needs
# libc++'s floating-point <charconv> support, only available from macOS 13.3 (the
# compiler's own diagnostic names the exact version: "'to_chars' is unavailable:
# introduced in macOS 13.3"). 13.3 is the precise, minimal fix - not a guess.
SKBUILD_CMAKE_DEFINE = "GRUNK_WITH_TASKFLOW=OFF;CMAKE_OSX_DEPLOYMENT_TARGET=13.3"

[tasks]
# cmake -P (a plain CMake script), not bash - unlike scripts/install_adolc.sh/
# install_adocct.sh (bash, but Linux-only, matching the `ad` feature they belong
# to), this bootstrap runs as part of the `default` environment (linux-64/osx-64/
# win-64), and win-64 has no bash by default - cmake itself is already a hard
# dependency on all three platforms, so scripts/install_grunk.cmake works
# identically everywhere without a separate batch/PowerShell port.
install_grunk = { cmd = "cmake -P scripts/install_grunk.cmake", description = "Clone, build, and install grunk into .deps/grunk (idempotent)." }

configure = { cmd = [
    "cmake",
    "-G", "Ninja",
    "-S", ".",
    "-B", "build",
    "-D", "CMAKE_INSTALL_PREFIX=build/install",
    "-D", "CMAKE_BUILD_TYPE={{ config }}",
    "-D", "CMAKE_EXPORT_COMPILE_COMMANDS=ON",
], args = [
    { "arg" = "config", "default" = "Release" }
], depends-on = ["install_grunk"], description = "Configure the CMake build." }

build = { cmd = "cmake --build build --parallel", description = "Build the plugin and test harness." }

generate_code = { cmd = "cmake --build build --target generate_code", description = "Regenerate OCCT bindings (requires -D GRUNK_OCCT_GENERATE_CODE=ON at configure time)." }

test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"], description = "Run the test harness." }

# Pure-Python, no build dependency at all - tests codegen/hooks.py's own
# CodeGenerator subclass directly (see tests/python/test_hooks.py's own module
# docstring for why these live here rather than in grunk's own shared
# tests/python/test_codegen.py).
test_hooks = { cmd = "pytest -xvs tests/python", description = "Run this plugin's own codegen/hooks.py unit tests." }

install = { cmd = "cmake --install build", depends-on = ["build"], description = "Install occt_plugin into build/install (CMAKE_INSTALL_PREFIX, set by the configure task) - run `cmake --install build --prefix <path>` directly for a different location." }

[tasks.all]
depends-on = ["configure", "build", "test", "test_hooks", "run_examples"]
description = "Configure, build, test, test_hooks, and run the examples."

# run_examples is platform-specific only in the plugin filename it passes to
# run_example.py (see examples/run_example.py's own argv[1]) - CMake's own default
# shared-library naming convention differs per platform (occt_plugin's CMakeLists.txt
# doesn't override it): libocct_plugin.so (Linux), libocct_plugin.dylib (macOS),
# occt_plugin.dll (Windows, no "lib" prefix by default).
[target.linux-64.tasks]
run_examples = { cmd = "python examples/run_example.py build/libocct_plugin.so", depends-on = ["build"], description = "Run the example recipes under examples/ (see examples/README.md)." }

[target.osx-64.tasks]
run_examples = { cmd = "python examples/run_example.py build/libocct_plugin.dylib", depends-on = ["build"], description = "Run the example recipes under examples/ (see examples/README.md)." }

[target.win-64.tasks]
run_examples = { cmd = "python examples/run_example.py build/occt_plugin.dll", depends-on = ["build"], description = "Run the example recipes under examples/ (see examples/README.md)." }

# AD-enabled build/test tasks - same names as the plain ones above (configure/build/
# test/all), but only ever visible in the `ad` environment (see [environments] -
# `no-default-feature = true` there means this feature's own tasks are the *only*
# ones `ad` has, no collision with the plain ones above): `pixi run -e ad configure`/
# `pixi run -e ad build`/`pixi run -e ad test` instead of the old configure_ad/
# build_ad/test_ad names. Uses a separate build directory (build-ad/) rather than
# build/, so the plain and AD-enabled variants can coexist without reconfiguring/
# rebuilding one to get the other.
[feature.ad.tasks]
# "grunk-ad", not "grunk" (the default environment's own name, see [tasks]'s own
# install_grunk) - this environment's own conda env (.pixi/envs/ad) has its own
# Lua/yaml-cpp builds, distinct from .pixi/envs/default's - see scripts/
# install_grunk.cmake's own comment on its optional GRUNK_INSTALL_NAME for why
# sharing one .deps/grunk between both environments is wrong, not just untidy.
install_grunk = { cmd = "cmake -D GRUNK_INSTALL_NAME=grunk-ad -P scripts/install_grunk.cmake", description = "Clone, build, and install grunk into .deps/grunk-ad (idempotent)." }

install_adolc = { cmd = "bash scripts/install_adolc.sh", description = "Download, build, and install ADOL-C 2.7.2 into .deps/adolc (idempotent)." }

install_adocct = { cmd = "bash scripts/install_adocct.sh", depends-on = ["install_adolc"], description = "Clone and build adOCCT against the ADOL-C install above, into .deps/adocct (idempotent, involved - see scripts/install_adocct.sh)." }

configure = { cmd = [
    "cmake",
    "-G", "Ninja",
    "-S", ".",
    "-B", "build-ad",
    "-D", "CMAKE_INSTALL_PREFIX=build-ad/install",
    "-D", "CMAKE_BUILD_TYPE={{ config }}",
    "-D", "CMAKE_EXPORT_COMPILE_COMMANDS=ON",
    "-D", "GRUNK_OCCT_ENABLE_AD=ON",
    "-D", "ADOCCT_DIR=.deps/adocct",
], args = [
    { "arg" = "config", "default" = "Release" }
], depends-on = ["install_grunk", "install_adocct"], description = "Configure the AD-enabled build (build-ad/)." }

build = { cmd = "cmake --build build-ad --parallel", description = "Build the AD-enabled plugin and test harness." }

test = { cmd = "ctest --test-dir build-ad --output-on-failure", depends-on = ["build"], description = "Run the AD-enabled test harness (tests/test_ad.cpp - a closed-form derivative check)." }

# Installs *both* occt_plugin and adolc_plugin (grunk-adolc's own install(TARGETS
# adolc_plugin ...), inherited via its FetchContent add_subdirectory - see
# CMakeLists.txt's own comment on the GRUNK_OCCT_ENABLE_AD branch's install()).
install = { cmd = "cmake --install build-ad", depends-on = ["build"], description = "Install occt_plugin and adolc_plugin into build-ad/install (CMAKE_INSTALL_PREFIX, set by the configure task) - run `cmake --install build-ad --prefix <path>` directly for a different location." }

# Same examples/run_example.py the default environment's own run_examples task
# uses (see [target.linux-64.tasks] above) - the *second* argument (grunk-adolc's
# own adolc_plugin, built alongside occt_plugin here - see CMakeLists.txt's own
# GRUNK_OCCT_ENABLE_AD FetchContent block) is what makes run_example.py verify
# examples/bspline_curve.grr.yml's own AD derivative against finite differences,
# not just check the primal curve position - see that script's own top comment.
run_examples = { cmd = "python examples/run_example.py build-ad/libocct_plugin.so build-ad/_deps/grunk-adolc-build/libadolc_plugin.so", depends-on = ["build"], description = "Run the example recipes under examples/ (see examples/README.md), including the AD derivative check." }

[feature.ad.tasks.all]
depends-on = ["configure", "build", "test", "run_examples"]
description = "Bootstrap ADOL-C/adOCCT if needed, then configure, build, test, and run the examples for the AD-enabled variant."

# Two fully separate pixi environments, each with their own .pixi/envs/<name>
# package set and no task-name collisions between them (see [feature.ad]'s own
# comment for why `ad` needs `no-default-feature = true`, not just its own
# `features = ["ad"]`): `default` (implicit [dependencies]/[tasks]/[pypi-
# dependencies]/[target.linux-64.activation.env] plus [feature.occt.dependencies] -
# stock occt) and `ad` (only [feature.ad.*] - adOCCT/ADOL-C, no occt package, no
# Python/codegen tooling, at all).
[environments]
default = { features = ["occt"] }
ad = { features = ["ad"], no-default-feature = true }
tools = { features = ["tools"], no-default-feature = true }

# REUSE (license-compliance) tooling - kept in its own environment/feature (like
# `ad`) rather than added to [dependencies], since nothing else here needs it and
# it has no reason to affect the default/ad environments' own package sets.
[feature.tools.dependencies]
python = "*"

[feature.tools.pypi-dependencies]
reuse = "*"

[feature.tools.tasks]
_reuse = { cmd = "reuse {{ sub_cmd }}", args = [
    { "arg" = "sub_cmd", "default" = "lint" },
] }

[tasks.reuse]
args = [{ "arg" = "sub_cmd", "default" = "lint" }]
depends-on = [{ task = "_reuse", environment = "tools", args = ["{{ sub_cmd }}"] }]
description = "Run the REUSE license-compliance tool. sub_cmd selects the REUSE subcommand (e.g. lint, spdx) - defaults to lint."

uses:
  grunk: 0.5.0
  occt: 0.1.0
modules:
  me: |
    function seed_point(x, y, z)
        if adolc ~= nil then
            local xa = adolc.adouble.new(x)
            xa:setADValue(0, 1.0)
            return occt.gp_Pnt.new(xa, y, z)
        end
        return occt.gp_Pnt.new(x, y, z)
    end

    function primal_value(v)
        if adolc ~= nil then
            return v:getValue()
        end
        return v
    end

    function ad_derivative(v)
        if adolc ~= nil then
            return v:getADValue(0)
        end
        return 0.0
    end
parameters:
  p2_x: 0.0
  p2_y: 1.0
  p2_z: 2.0
steps: |
  p1 = occt.gp_Pnt.new(0.0, 0.0, 0.0)
  p2 = me.seed_point(p2_x, p2_y, p2_z)
  p3 = occt.gp_Pnt.new(0.0, 2.0, -1.0)
  p4 = occt.gp_Pnt.new(0.0, 0.0, 3.0)
  p5 = occt.gp_Pnt.new(0.0, 4.0, 0.0)

  poles = occt.gp_Pnt.as_vec(p1, p2, p3, p4, p5)
  knots = occt.real_vec(0.0, 1.0, 2.0, 3.0)
  mults = occt.int_vec(3, 1, 1, 3)
  degree = 2

  curve = occt.Geom_BSplineCurve.new(poles, knots, mults, degree)

  mid = curve:Value(0.5)

  mid_x_value = me.primal_value(mid:X())
  mid_y_value = me.primal_value(mid:Y())
  mid_z_value = me.primal_value(mid:Z())

  mid_x_deriv = me.ad_derivative(mid:X())
  mid_y_deriv = me.ad_derivative(mid:Y())
  mid_z_deriv = me.ad_derivative(mid:Z())
outputs:
  mid_x_value: mid_x_value
  mid_y_value: mid_y_value
  mid_z_value: mid_z_value
  mid_x_deriv: mid_x_deriv
  mid_y_deriv: mid_y_deriv
  mid_z_deriv: mid_z_deriv
